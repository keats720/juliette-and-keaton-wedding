<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Photos — Juliette & Keaton</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://use.typekit.net/xpa3edi.css">
</head>
<body>
  <nav class="site-nav">
    <button class="nav-toggle" aria-label="Menu" onclick="this.parentElement.classList.toggle('open')">
      <span class="menu-label">Menu</span><span class="close-label">✕</span>
    </button>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/information">Information</a></li>
      <li><a href="/schedule">Schedule</a></li>
      <li><a href="/dress-code">Attire</a></li>
      <li><a href="/registry">Registry</a></li>
      <li><a href="/rsvp">RSVP</a></li>
      <li><a href="/shuttle">Shuttle</a></li>
      <li><a href="/photos">Photos</a></li>
    </ul>
  </nav>

  <main>
    <div class="page-title">
      <h1>Photos<br><span class="title-script">from our day</span></h1>
    </div>

    <div id="gallery" class="photo-gallery">
      <p class="photo-loading">Loading photos…</p>
    </div>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close">✕</button>
    <button class="lightbox-prev" aria-label="Previous photo">‹</button>
    <img class="lightbox-img" alt="Wedding photo">
    <button class="lightbox-next" aria-label="Next photo">›</button>
    <div class="lightbox-bar">
      <span class="lightbox-count"></span>
      <button class="lightbox-share" type="button">Share</button>
      <button class="lightbox-download" type="button">Download</button>
    </div>
  </div>

  <footer class="site-footer">
    <!-- Dragonfly injected by js/dragonfly.js -->
  </footer>

  <script src="js/rsvp-code.js"></script>
  <script src="js/dragonfly.js"></script>
  <script src="js/photos.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP — Juliette & Keaton</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://use.typekit.net/xpa3edi.css">
  <style>
    html, body {
      overflow-x: hidden;
    }

    body {
      position: relative;
    }

    .rsvp-bg-flower {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 110vw;
      max-width: 900px;
      height: auto;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
      color: var(--text);
    }

    .rsvp-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }

    .rsvp-card {
      background: rgba(213, 226, 240, 0.88);
      border: 1px solid var(--btn-border);
      padding: 3rem 2.5rem;
      position: relative;
      border-radius: 4px;
    }

    .rsvp-card::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border: 1px solid var(--btn-border);
      border-radius: 3px;
      pointer-events: none;
      opacity: 0.5;
    }

    .rsvp-card h1 {
      font-family: var(--font-newicon);
      font-weight: 300;
      font-size: 2.4rem;
      text-align: center;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
      color: var(--text);
    }

    .rsvp-subtitle {
      text-align: center;
      font-family: var(--font-tenor);
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .script-cap {
      font-family: var(--font-loop);
      font-size: 1.4em;
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 0.03em;
    }

    .rsvp-card label {
      font-family: var(--font-tenor);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 400;
    }

    .rsvp-card input[type="text"],
    .rsvp-card input[type="email"],
    .rsvp-card textarea,
    .rsvp-card select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--btn-border);
      background: #d3dfed;
      font-family: var(--font-tenor);
      font-weight: 400;
      font-size: 0.85rem;
      color: var(--text);
      outline: none;
      border-radius: 4px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .rsvp-card input::placeholder,
    .rsvp-card textarea::placeholder {
      color: var(--btn-text);
      opacity: 0.6;
    }

    .rsvp-card input:focus,
    .rsvp-card textarea:focus,
    .rsvp-card select:focus {
      border-color: var(--text);
      box-shadow: 0 0 0 3px rgba(44, 126, 244, 0.12);
    }

    .rsvp-card textarea {
      resize: vertical;
      min-height: 80px;
    }

    .field-group {
      margin-bottom: 1.5rem;
    }

    .lookup-group {
      display: flex;
      gap: 0.75rem;
    }

    .lookup-group input {
      flex: 1;
    }

    .radio-group {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.25rem;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-family: var(--font-tenor);
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1;
    }

    .radio-option span {
      display: inline-flex;
      align-items: center;
      min-height: 18px;
    }

    .radio-option input[type="radio"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--text);
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      flex-shrink: 0;
      margin: 0;
      padding: 0;
    }

    .radio-option input[type="radio"]:checked {
      border-color: var(--text-muted);
      background: var(--text-muted);
      box-shadow: inset 0 0 0 3px white;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.25rem;
      margin-top: 0.25rem;
    }

    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      font-family: var(--font-tenor);
      font-size: 0.8rem;
      color: var(--text);
      line-height: 1;
      padding: 0 0;
    }

    

    .checkbox-option input[type="checkbox"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--text);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      flex-shrink: 0;
      margin: 0;
      padding: 0;
    }

    .checkbox-option input[type="checkbox"]:checked {
      border-color: var(--text-muted);
      background: var(--text-muted);
    }

    .checkbox-option input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .field-note {
      font-family: var(--font-tenor);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0.25rem 0 0.5rem;
      font-weight: 400;
    }

    .other-text-wrap {
      width: 100%;
      margin-top: 0.5rem;
      display: none;
      animation: rsvp-fadeIn 0.3s ease;
    }

    .other-text-wrap.visible {
      display: block;
    }

    .rsvp-btn {
      display: inline-block;
      font-family: var(--font-newicon);
      font-weight: 400;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .rsvp-btn:hover {
      background: #cdd9ea;
      border-color: #bccde2;
    }

    .rsvp-btn-primary {
      background: var(--text);
      color: var(--white);
      border-color: var(--text);
    }

    .rsvp-btn-primary:hover {
      background: var(--text-muted);
      border-color: var(--text-muted);
    }

    .rsvp-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .rsvp-btn-full {
      width: 100%;
      margin-top: 0.5rem;
    }

    .rsvp-fields {
      display: none;
      animation: rsvp-fadeIn 0.4s ease;
    }

    .rsvp-fields.visible {
      display: block;
    }

    .guest-section {
      position: relative;
      padding-bottom: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--btn-border);
      animation: rsvp-fadeIn 0.4s ease;
    }

    .guest-section:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .guest-section-name {
      font-family: var(--font-newicon);
      font-weight: 100;
      font-size: 1.4rem;
      line-height: 2;
      color: var(--text);
      margin-bottom: 0.75rem;
      padding: 0.4rem 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .plus-one-section {
      display: none;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--btn-border);
      animation: rsvp-fadeIn 0.4s ease;
    }

    .plus-one-section.visible {
      display: block;
    }

    .section-label {
      font-family: var(--font-loop);
      font-weight: 400;
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 1.25rem;
    }

    .rsvp-message {
      text-align: center;
      padding: 0.75rem;
      font-family: var(--font-tenor);
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
      display: none;
      border-radius: 4px;
    }

    .rsvp-message.visible {
      display: block;
      animation: rsvp-fadeIn 0.3s ease;
    }

    .rsvp-message.error {
      color: #B85C5C;
      background: #faf0f0;
      border: 1px solid #e8d0d0;
    }

    .rsvp-message.success {
      color: var(--text-muted);
      background: rgba(213, 226, 240, 0.5);
      border: 1px solid var(--btn-border);
    }

    .rsvp-message.info {
      color: var(--text-muted);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
    }

    .rsvp-divider {
      height: 1px;
      background: var(--btn-border);
      margin: 2rem 0;
    }

    .shared-fields {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--btn-border);
    }

    .success-screen {
      display: none;
      text-align: center;
      padding: 1rem 0;
      animation: rsvp-fadeIn 0.5s ease;
    }

    .success-screen.visible {
      display: block;
    }

    .success-screen h2 {
      font-family: var(--font-newicon);
      font-weight: 300;
      font-size: 2rem;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text);
    }

    .success-screen p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .success-screen .more-info {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--btn-border);
      font-family: var(--font-loop);
      font-size: 1.1rem;
      color: var(--text);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: rsvp-spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    .rsvp-btn:not(.rsvp-btn-primary) .spinner {
      border: 2px solid rgba(44, 126, 244, 0.3);
      border-top-color: var(--text);
    }

    .rsvp-back-btn {
      background: none;
      border: none;
      font-family: var(--font-tenor);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      margin-bottom: 1rem;
      transition: color 0.2s;
    }

    .rsvp-back-btn:hover {
      color: var(--text);
    }

    @keyframes rsvp-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes rsvp-fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .rsvp-card { padding: 2rem 1.5rem; }
      .rsvp-card h1 { font-size: 1.8rem; }
      .radio-group { flex-direction: column; gap: 0.75rem; }
      .rsvp-container { padding: 2rem 1.5rem; }
      .checkbox-group { flex-direction: column; gap: 0.6rem; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <button class="nav-toggle" aria-label="Menu" onclick="this.parentElement.classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="information.html">Information</a></li>
      <li><a href="schedule.html">Schedule</a></li>
      <li><a href="dress-code.html">Attire</a></li>
      <li><a href="registry.html">Registry</a></li>
    </ul>
  </nav>

  <main style="position: relative;">
    <img src="assets/flower.svg" alt="" class="rsvp-bg-flower" aria-hidden="true">
    <div class="rsvp-container">
      <div class="rsvp-card">

        <h1>RSVP</h1>
        <p class="rsvp-subtitle">We would be honoured by your presence</p>

        <div id="msg" class="rsvp-message"></div>

        <!-- Step 1: Code entry -->
        <div id="lookup-section">
          <div class="field-group">
            <label for="rsvp-code">Your RSVP Code</label>
            <div class="lookup-group">
              <input type="text" id="rsvp-code" placeholder="Enter your code" autocomplete="off">
              <button class="rsvp-btn" id="lookup-btn" onclick="lookupGuest()">Start</button>
            </div>
          </div>
        </div>

        <!-- Step 2: RSVP form (dynamically populated) -->
        <div id="rsvp-fields" class="rsvp-fields">
          <button class="rsvp-back-btn" onclick="goBack()">&larr; Back</button>
          <div id="guests-container"></div>

          <div class="shared-fields">
            <div class="field-group">
              <label>Accommodation Plan</label>
              <p class="field-note">So that we can plan numbers for the shuttle service</p>
              <div class="checkbox-group">
                <label class="checkbox-option">
                  <input type="checkbox" name="accommodation" value="Coast Bastion Hotel">
                  <span>Coast Bastion Hotel</span>
                </label>
                <label class="checkbox-option">
                  <input type="checkbox" name="accommodation" value="Saturday Night Camping">
                  <span>Saturday Night Camping</span>
                </label>
                <label class="checkbox-option">
                  <input type="checkbox" name="accommodation" value="Other (taking shuttle)">
                  <span>Other (taking shuttle)</span>
                </label>
                <label class="checkbox-option">
                  <input type="checkbox" name="accommodation" value="Other (not taking shuttle)">
                  <span>Other (not taking shuttle)</span>
                </label>
              </div>
            </div>

            <div class="field-group">
              <label>Additional Events</label>
              <p class="field-note">Please let us know if you plan on dropping in to either of these events</p>
              <div class="checkbox-group">
                <label class="checkbox-option">
                  <input type="checkbox" name="extra-events" value="Friday BBQ">
                  <span>Friday BBQ (5:00 PM – 9:00 PM)</span>
                </label>
                <label class="checkbox-option">
                  <input type="checkbox" name="extra-events" value="Sunday Breakfast">
                  <span>Sunday Brunch (10:00 AM – 12:00 PM)</span>
                </label>
              </div>
            </div>

            <div class="field-group">
              <label for="song">Song Request</label>
              <input type="text" id="song" placeholder="Get us on the dance floor with...">
            </div>

            <div class="field-group">
              <label for="notes">Notes</label>
              <textarea id="notes" placeholder="Anything else you'd like us to know"></textarea>
            </div>

            <button class="rsvp-btn rsvp-btn-primary rsvp-btn-full" id="submit-btn" onclick="submitRsvp()">
              Submit
            </button>
          </div>
        </div>

        <!-- Step 3: Success -->
        <div id="success-screen" class="success-screen">
          <h2>Thank You</h2>
          <p id="success-message"></p>
          <p class="more-info">More information to follow</p>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/rsvp-code.js"></script>
  <script src="js/dragonfly.js"></script>
  <script>
    const API_BASE = 'https://wedding-rsvp.keaton-d8b.workers.dev';
    const DIETARY_OPTIONS = ['Vegetarian', 'Vegan', 'Gluten Free', 'Shellfish', 'Lactose Intolerant'];

    let partyGuests = [];

    (function autoFillFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (code) {
        document.getElementById('rsvp-code').value = code;
        lookupGuest();
      }
    })();

    // ── Lookup ──────────────────────────────────────────────

    async function lookupGuest() {
      const code = document.getElementById('rsvp-code').value.trim();
      if (!code) {
        showMessage('Please enter your RSVP code.', 'error');
        return;
      }

      setLoading('lookup-btn', true);
      hideMessage();

      try {
        const res = await fetch(`${API_BASE}/lookup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });

        const data = await res.json();

        if (!res.ok || !data.guests || data.guests.length === 0) {
          showMessage(
            "We couldn't find that code. Please check the code from your invitation email and try again.",
            'error'
          );
          setLoading('lookup-btn', false);
          return;
        }

        partyGuests = data.guests;
        renderGuests();

        document.getElementById('lookup-section').style.display = 'none';
        document.getElementById('rsvp-fields').classList.add('visible');

        const hasPrevious = partyGuests.some(g => g.previousRsvp);
        if (hasPrevious) {
          prefillAll();
          showMessage('We found your previous RSVP — feel free to update it.', 'info');
        } else {
          hideMessage();
        }
      } catch (err) {
        console.error(err);
        showMessage('Something went wrong. Please try again.', 'error');
      }

      setLoading('lookup-btn', false);
    }

    document.getElementById('rsvp-code').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') lookupGuest();
    });

    // ── Render guest sections ───────────────────────────────

    function renderGuests() {
      const container = document.getElementById('guests-container');
      container.innerHTML = '';

      partyGuests.forEach((guest, i) => {
        const section = document.createElement('div');
        section.className = 'guest-section';
        section.dataset.idx = i;

        let html = `<p class="guest-section-name">${scriptCapName(guest.name || 'Guest ' + (i + 1))}</p>`;

        html += `<div class="field-group">
          <label for="g${i}-name">Name</label>
          <input type="text" id="g${i}-name" value="${escAttr(guest.name)}" placeholder="Full name">
        </div>`;

        html += `<div class="field-group">
          <label for="g${i}-email">Email Address</label>
          <input type="email" id="g${i}-email" value="${escAttr(guest.email)}" placeholder="your@email.com">
        </div>`;

        html += `<div class="field-group">
          <label>Will ${partyGuests.length > 1 ? escHtml(guest.name.split(' ')[0] || 'they') : 'you'} be attending?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="g${i}-attending" value="yes" onchange="onAttendingChange(${i})">
              <span>Joyfully accepts</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="g${i}-attending" value="no" onchange="onAttendingChange(${i})">
              <span>Respectfully declines</span>
            </label>
          </div>
        </div>`;

        html += `<div id="g${i}-details" style="display:none;">`;
        html += buildDietaryHtml(`g${i}-diet`);

        if (guest.hasPlusOne) {
          html += `<div id="g${i}-plusone" class="plus-one-section visible">
            <p class="section-label">Plus One</p>
            <div class="field-group">
              <label for="g${i}-po-name">Guest Name</label>
              <input type="text" id="g${i}-po-name" placeholder="Full name">
            </div>`;
          html += buildDietaryHtml(`g${i}-po-diet`, 'Their Dietary Restrictions');
          html += `</div>`;
        }

        html += `</div>`;

        section.innerHTML = html;
        container.appendChild(section);
      });
    }

    function buildDietaryHtml(prefix, labelText) {
      labelText = labelText || 'Dietary Restrictions';
      let html = `<div class="field-group">
        <label>${escHtml(labelText)}</label>
        <div class="checkbox-group">`;

      DIETARY_OPTIONS.forEach(opt => {
        html += `<label class="checkbox-option">
          <input type="checkbox" name="${prefix}" value="${opt}" onchange="onDietaryChange('${prefix}')">
          <span>${opt}</span>
        </label>`;
      });

      html += `<label class="checkbox-option">
          <input type="checkbox" name="${prefix}" value="Other" onchange="onDietaryChange('${prefix}')">
          <span>Other</span>
        </label>
        </div>
        <div id="${prefix}-other-wrap" class="other-text-wrap">
          <input type="text" id="${prefix}-other" placeholder="Please specify...">
        </div>
      </div>`;

      return html;
    }

    // ── Interactions ────────────────────────────────────────

    function onAttendingChange(idx) {
      const val = document.querySelector(`input[name="g${idx}-attending"]:checked`)?.value;
      document.getElementById(`g${idx}-details`).style.display = val === 'yes' ? 'block' : 'none';
    }

    function onDietaryChange(prefix) {
      const otherChecked = document.querySelector(`input[name="${prefix}"][value="Other"]`)?.checked;
      const wrap = document.getElementById(`${prefix}-other-wrap`);
      if (otherChecked) wrap.classList.add('visible');
      else wrap.classList.remove('visible');
    }

    function collectDietary(prefix) {
      const checked = Array.from(document.querySelectorAll(`input[name="${prefix}"]:checked`))
        .map(cb => cb.value)
        .filter(v => v !== 'Other');

      const otherChecked = document.querySelector(`input[name="${prefix}"][value="Other"]`)?.checked;
      if (otherChecked) {
        const otherText = document.getElementById(`${prefix}-other`).value.trim();
        checked.push(otherText ? 'Other: ' + otherText : 'Other');
      }

      return checked.join(', ');
    }

    // ── Submit ──────────────────────────────────────────────

    async function submitRsvp() {
      const guestPayloads = [];

      for (let i = 0; i < partyGuests.length; i++) {
        const attending = document.querySelector(`input[name="g${i}-attending"]:checked`)?.value;
        if (!attending) {
          const name = partyGuests[i].name.split(' ')[0] || 'Guest ' + (i + 1);
          showMessage(`Please let us know if ${name} can make it.`, 'error');
          return;
        }

        const entry = {
          guestId: partyGuests[i].id,
          attending: attending === 'yes',
          name: document.getElementById(`g${i}-name`).value.trim(),
          email: document.getElementById(`g${i}-email`).value.trim(),
          dietary: collectDietary(`g${i}-diet`),
        };

        if (partyGuests[i].hasPlusOne && attending === 'yes') {
          entry.plusOneName = document.getElementById(`g${i}-po-name`).value.trim();
          entry.plusOneDietary = collectDietary(`g${i}-po-diet`);
        }

        guestPayloads.push(entry);
      }

      setLoading('submit-btn', true);

      const accommodation = Array.from(document.querySelectorAll('input[name="accommodation"]:checked')).map(cb => cb.value);
      const extraEvents = Array.from(document.querySelectorAll('input[name="extra-events"]:checked')).map(cb => cb.value);

      const payload = {
        guests: guestPayloads,
        accommodation,
        extraEvents,
        songRequest: document.getElementById('song').value.trim(),
        notes: document.getElementById('notes').value.trim(),
      };

      try {
        const res = await fetch(`${API_BASE}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Submit failed');

        document.getElementById('rsvp-fields').classList.remove('visible');
        document.getElementById('success-screen').classList.add('visible');

        const anyAttending = guestPayloads.some(g => g.attending);
        document.getElementById('success-message').textContent =
          anyAttending
            ? "We can't wait to celebrate with you!"
            : "We'll miss you, but thank you for letting us know.";

      } catch (err) {
        console.error(err);
        showMessage('Something went wrong submitting your RSVP. Please try again.', 'error');
      }

      setLoading('submit-btn', false);
    }

    // ── Prefill from previous RSVP ─────────────────────────

    function prefillAll() {
      let sharedPrefilled = false;

      partyGuests.forEach((guest, i) => {
        const rsvp = guest.previousRsvp;
        if (!rsvp) return;

        if (rsvp.attending !== undefined) {
          const radio = document.querySelector(`input[name="g${i}-attending"][value="${rsvp.attending ? 'yes' : 'no'}"]`);
          if (radio) { radio.checked = true; onAttendingChange(i); }
        }

        if (rsvp.dietary) prefillDietary(`g${i}-diet`, rsvp.dietary);
        if (rsvp.plusOneName) document.getElementById(`g${i}-po-name`).value = rsvp.plusOneName;
        if (rsvp.plusOneDietary) prefillDietary(`g${i}-po-diet`, rsvp.plusOneDietary);

        if (!sharedPrefilled) {
          if (rsvp.songRequest) document.getElementById('song').value = rsvp.songRequest;
          if (rsvp.notes) document.getElementById('notes').value = rsvp.notes;
          if (rsvp.accommodation) prefillCheckboxGroup('accommodation', rsvp.accommodation);
          if (rsvp.extraEvents) prefillCheckboxGroup('extra-events', rsvp.extraEvents);
          sharedPrefilled = true;
        }
      });
    }

    function prefillDietary(prefix, value) {
      const items = value.split(', ');
      items.forEach(item => {
        const match = DIETARY_OPTIONS.find(opt => item === opt);
        if (match) {
          const cb = document.querySelector(`input[name="${prefix}"][value="${match}"]`);
          if (cb) cb.checked = true;
        } else if (item.startsWith('Other: ') || item === 'Other') {
          const cb = document.querySelector(`input[name="${prefix}"][value="Other"]`);
          if (cb) cb.checked = true;
          onDietaryChange(prefix);
          if (item.startsWith('Other: ')) {
            document.getElementById(`${prefix}-other`).value = item.replace('Other: ', '');
          }
        }
      });
    }

    function prefillCheckboxGroup(name, value) {
      const items = value.split(', ');
      items.forEach(item => {
        const cb = document.querySelector(`input[name="${name}"][value="${item}"]`);
        if (cb) cb.checked = true;
      });
    }

    // ── Navigation ──────────────────────────────────────────

    function goBack() {
      partyGuests = [];
      document.getElementById('guests-container').innerHTML = '';
      document.getElementById('rsvp-fields').classList.remove('visible');
      document.getElementById('lookup-section').style.display = '';
      document.getElementById('song').value = '';
      document.getElementById('notes').value = '';
      document.querySelectorAll('input[name="accommodation"], input[name="extra-events"]').forEach(cb => cb.checked = false);
      hideMessage();
    }

    // ── Utilities ───────────────────────────────────────────

    function showMessage(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `rsvp-message visible ${type}`;
    }

    function hideMessage() {
      document.getElementById('msg').className = 'rsvp-message';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (loading) {
        btn.disabled = true;
        btn._origHTML = btn.innerHTML;
        btn.innerHTML = '<span class="spinner"></span> ' + btn.textContent;
      } else {
        btn.disabled = false;
        if (btn._origHTML) btn.innerHTML = btn._origHTML;
      }
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function scriptCapName(name) {
      return escHtml(name).split(' ').map(word =>
        `<span class="script-cap">${word[0]}</span>${word.slice(1)}`
      ).join(' ');
    }

    function escAttr(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>

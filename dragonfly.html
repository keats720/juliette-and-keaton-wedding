<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correct Dragonfly Calligraphy with Perfect Motion</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #f7f7f7;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* 1. TRACKER: Handles smooth X positioning ONLY (JS controlled) */
    #tracker {
      position: fixed; 
      top: 50%;
      left: 0; 
      pointer-events: none;
      /* Center exactly on the cursor using margins */
      margin-top: -75px;  /* Half of SVG height */
      margin-left: -100px; /* Half of SVG width */
    }

    /* 2. FLIPPER: Handles the left/right turning with a smooth transition */
    #flipper {
      width: 200px;
      height: 150px;
      /* Smooth swoop transition for direction change */
      transition: transform 0.4s ease-in-out; 
      transform-origin: center center; 
    }

    /* 3. FLOATER: Handles the vertical bobbing */
    #floater {
      animation: float 3s ease-in-out infinite;
    }

    /* 4. SVG STYLING & ANIMATIONS */
    .dragonfly-svg {
      width: 200px;
      height: 150px;
      overflow: visible;
    }

    /* The central coordinates for calligraphic knot and symmetry are (100, 75) */
    .wing, .tail {
      transform-origin: 100px 75px; 
    }

    /* Calligraphic tops are larger, flap more subtly */
    .wing-top { animation: flapTop 2.5s infinite alternate ease-in-out; }
    /* Calligraphic bottoms are smaller, flap more energetically */
    .wing-bottom { animation: flapBottom 2s infinite alternate ease-in-out; animation-delay: 0.05s; }
    
    .tail { animation: tailBob 3s ease-in-out infinite; }

    /* --- KEYFRAMES --- */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); } /* Bob height */
    }

    @keyframes flapTop {
      0% { transform: rotate(0deg) scaleY(1); }
      100% { transform: rotate(-5deg) scaleY(0.7); } /* More subtle calligraphic flap */
    }

    @keyframes flapBottom {
      0% { transform: rotate(0deg) scaleY(1); }
      100% { transform: rotate(10deg) scaleY(0.5); }
    }

    @keyframes tailBob {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(4deg); } 
    }
  </style>
</head>
<body>

  <div id="tracker">
    <div id="flipper">
      <div id="floater">
        <svg class="dragonfly-svg" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" stroke="#222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
              
              <path class="body" d="M 100,75 C 95,65 92,68 95,72 C 100,78 105,75 100,75" />
              
              <path class="tail" d="M 100,75 C 140,110 170,135 185,140 C 190,141 193,137 190,133 C 185,130 165,133 185,135 C 190,137 185,140 185,133 C 180,128 160,133 100,75" />
              
              <path class="wing wing-top" d="M 100,75 C 20,10 10,70 100,75" />
              <path class="wing wing-bottom" d="M 100,75 C 1,90 55,140 100,75" />
              
              <path class="wing wing-top" d="M 100,75 C 200,0 195,60 100,75" />
              <path class="wing wing-bottom" d="M 100,75 C 190,65 195,120 100,75" />
            </g>
          </svg>
      </div>
    </div>
  </div>

  <script>
    /* PRESERVED COMPLEX MOTION AND FLIP SCRIPT */
    const tracker = document.getElementById('tracker');
    const flipper = document.getElementById('flipper'); 
    
    let currentX = window.innerWidth / 2; 
    let targetX = window.innerWidth / 2;  
    let scaleX = 1;                       
    
    /* SPEED CLAMP (matches float speed) */
    const maxSpeed = 0.25; 
    const acceleration = 0.04; 
    
    document.addEventListener('mousemove', (e) => {
      targetX = e.clientX;
      
      /* Decide direction and apply flip to flipper ONLY */
      if (targetX > currentX + 5) {
        scaleX = -1; // Face Right
      } else if (targetX < currentX - 5) {
        scaleX = 1;  // Face Left
      }
      
      /* Smooth swoop transition */
      flipper.style.transform = `scaleX(${scaleX})`;
    });

    /* Animation Loop for Smooth Gliding */
    function animate() {
      let distance = targetX - currentX;
      let speed = distance * acceleration; 
      
      /* Speed Limit Clamp */
      if (speed > maxSpeed) speed = maxSpeed;
      if (speed < -maxSpeed) speed = -maxSpeed;

      currentX += speed;

      /* Apply ONLY horizontal movement to the tracker */
      tracker.style.transform = `translateX(${currentX}px)`;
      
      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juliette & Keaton — Wedding</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hero-image-wrap { margin: 0 auto 1rem; max-width: 48%; min-width: 260px; padding: 0 1rem; }
    .hero-image-wrap img { width: 100%; height: auto; display: block; aspect-ratio: 16/9; object-fit: cover; }
    .hero-image-placeholder { aspect-ratio: 16/9; background: var(--cream-dark); display: flex; align-items: center; justify-content: center; color: var(--ink-light); font-family: var(--sans-thin); font-size: 0.85rem; font-weight: 300; letter-spacing: 0.08em; }
    .hero-cta { text-align: center; margin: 0.75rem 0 3.5rem; }
    .hero-date-loc { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; justify-items: center; gap: 2rem; margin: 0 auto 1.25rem; font-family: var(--sans-thin); max-width: 320px; }
    .hero-date-loc span { font-size: 1rem; font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); line-height: 1.35; text-align: center; }
    .hero-date-loc .divider { width: 1px; background: rgba(44,44,44,0.2); align-self: stretch; min-height: 2.5rem; }
    .site-footer .footer-label { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 0.2rem; }
    .site-footer .footer-date { font-size: 0.55rem; font-weight: 300; letter-spacing: 0.1em; opacity: 0.9; }
  </style>
</head>
<body>
  <header class="page-hero">
    <p class="hero-names">Juliette & Keaton</p>
    <p class="hero-meta">SATURDAY, JULY 18, 2026 · CINNABAR VALLEY, NANAIMO BC</p>
    <p id="countdown" class="countdown"></p>
  </header>

  <nav class="site-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="information.html">Information</a></li>
      <li><a href="schedule.html">Schedule</a></li>
      <li><a href="accommodation.html">Accommodation</a></li>
      <li><a href="dress-code.html">Dress Code</a></li>
      <li><a href="https://example.com/registry" target="_blank" rel="noopener">Registry</a></li>
    </ul>
  </nav>

  <div class="hero-image-wrap">
    <img src="assets/hero.jpg" alt="Juliette & Keaton" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="hero-image-placeholder" style="display: none;">Your photo here — add assets/hero.jpg</div>
  </div>

  <div class="hero-cta">
    <div class="hero-date-loc">
      <span>JULY<br>18, 2026</span>
      <span class="divider" aria-hidden="true"></span>
      <span>CINNABAR VALLEY</span>
    </div>
    <a id="rsvp" class="btn" href="https://www.notion.so/" target="_blank" rel="noopener">RSVP</a>
    <!-- Replace the href above with your Notion form URL when ready -->
  </div>

  <footer class="site-footer">
    <p class="footer-label">Celebrating Juliette & Keaton</p>
  </footer>

  <script>
    (function() {
      var d = new Date(2026, 6, 18);
      var now = new Date();
      var diff = d - now;
      var days = Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
      var el = document.getElementById('countdown');
      if (el) el.textContent = days === 0 ? "Today's the day!" : days + ' DAYS TO GO';
    })();
  </script>
  <script src="js/dragonfly.js"></script>
</body>
</html>
